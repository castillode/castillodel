<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castillo del Año | Rifas Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%);
      --card: rgba(255, 255, 255, 0.95);
      --primary-blue: #0284c7;
      --gold: #d97706;
      --gold-light: #f59e0b;
      --silver: #94a3b8;
      --silver-dark: #475569;
      --bronze: #b45309;
      --bronze-dark: #78350f;
      --red: #dc2626;
      --green: #16a34a;
      --text: #0f172a;

      /* Variables dinámicas por tema */
      --current-theme: var(--gold-light);
      --current-border: var(--gold);
      --current-bg-prizes: #fffbe3;
      --current-border-prizes: #fde68a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      padding: 20px 15px 40px;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ENCABEZADO Y LOGO CON DESTELLO CADA 5s */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container {
      position: relative;
      display: block;
      margin: 0 auto 12px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.4) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      animation: shine 5s infinite ease-in-out;
    }

    @keyframes shine {
      0% { left: -60%; }
      20% { left: 140%; }
      100% { left: 140%; }
    }

    /* PESTAÑAS DE NIVELES (ORO, PLATA, BRONCE) */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: 2px solid transparent;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .tab-btn[data-type="oro"].active { border-color: var(--gold-light); }
    .tab-btn[data-type="plata"].active { border-color: var(--silver); }
    .tab-btn[data-type="bronce"].active { border-color: var(--bronze); }

    .tab-price {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.9;
    }

    /* TARJETAS Y PREMIOS CON COLORES Y ANIMACIÓN DE CAMBIO */
    .card {
      background: var(--card);
      border: 3px solid var(--current-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: border-color 0.4s ease;
    }

    /* Animación de destello al alternar pestañas */
    .tab-switch-anim {
      animation: tabFlash 0.4s ease-out;
    }

    @keyframes tabFlash {
      0% {
        opacity: 0.4;
        transform: translateY(6px);
        box-shadow: 0 0 25px var(--current-theme);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
    }

    .prize-glow {
      color: var(--current-border) !important;
      animation: prizeGlow 2.5s infinite ease-in-out;
      transition: color 0.4s ease;
    }

    @keyframes prizeGlow {
      0%, 100% { text-shadow: 0 0 5px rgba(0, 0, 0, 0.1); transform: scale(1); }
      50% { text-shadow: 0 0 12px var(--current-theme); transform: scale(1.02); }
    }

    .prizes-info {
      background: var(--current-bg-prizes);
      border: 1px solid var(--current-border-prizes);
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      font-size: 0.88rem;
      text-align: left;
      line-height: 1.6;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* BARRAS Y GRILLA */
    .progress-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .progress-bar-bg {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--green), #22c55e);
      height: 100%;
      width: 100%;
      transition: width 0.5s ease;
    }

    .legend {
      display: flex;
      justify-content: space-around;
      background: #ffffff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-green { background: var(--green); }
    .dot-gold { background: var(--current-theme); }
    .dot-red { background: var(--red); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }

    .num {
      background: #ffffff;
      border: 2px solid var(--current-border);
      color: var(--text);
      padding: 14px 0;
      text-align: center;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .num:hover:not(.sold) {
      transform: translateY(-3px) scale(1.05);
      border-color: var(--current-theme);
    }

    .num.sel {
      background: linear-gradient(135deg, var(--current-border), var(--current-theme));
      color: #fff;
      border-color: var(--current-border);
      box-shadow: 0 0 12px var(--current-theme);
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .num.sold {
      background: #e2e8f0;
      color: #94a3b8;
      border-color: #cbd5e1;
      cursor: not-allowed;
      text-decoration: line-through;
      opacity: 0.6;
    }

    .num.shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .num.roulette-highlight {
      background: var(--current-theme) !important;
      color: #fff !important;
      transform: scale(1.15);
      box-shadow: 0 0 15px var(--current-theme);
    }

    /* BOTONES */
    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-gold { 
      background: var(--current-theme); 
      color: #fff; 
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-gold:hover { opacity: 0.9; transform: translateY(-2px); }

    .btn-out {
      background: #fff;
      border: 2px solid var(--current-border);
      color: var(--current-border);
      transition: all 0.3s ease;
    }
    .btn-out:hover {
      background: #f8fafc;
      transform: translateY(-2px);
    }

    /* FORMULARIO Y BOTÓN WHATSAPP */
    input {
      width: 100%;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: var(--text);
      margin: 6px 0 16px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .payment-box {
      background: #f8fafc;
      border: 1px dashed var(--current-border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.4s ease;
    }

    .btn-copy {
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-copy.copied {
      background: var(--green) !important;
      transform: scale(1.05);
    }

    .btn-wsp {
      width: 100%;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      animation: pulseWsp 2s infinite ease-in-out;
    }

    @keyframes pulseWsp {
      0%, 100% { box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transform: scale(1); }
      50% { box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6); transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="logo.png_20261001_151748_0000.png" alt="Logo Castillo del Año" class="logo-img" onerror="this.src='https://via.placeholder.com/480x200/0f172a/d97706?text=CASTILLO+DEL+A%C3%91O'">
    </div>
  </header>

  <!-- PESTAÑAS DE SELECCIÓN DE SORTEO -->
  <div class="tabs-container">
    <button class="tab-btn active" data-type="oro" onclick="switchRaffle('oro')">
      <span>🥇 SORTEO ORO</span>
      <span class="tab-price">Ticket: $20.000</span>
    </button>
    <button class="tab-btn" data-type="plata" onclick="switchRaffle('plata')">
      <span>🥈 SORTEO PLATA</span>
      <span class="tab-price">Ticket: $10.000</span>
    </button>
    <button class="tab-btn" data-type="bronce" onclick="switchRaffle('bronce')">
      <span>🥉 SORTEO BRONCE</span>
      <span class="tab-price">Ticket: $5.000</span>
    </button>
  </div>

  <div class="card" id="main-card">
    <h2 class="prize-glow" id="prize-title" style="font-size: 1.4rem;">Gran Premio: $1'000.000 COP</h2>
    <p style="margin-top: 4px; font-size:0.95rem;" id="ticket-info">Valor Ticket: <strong>$20.000 COP</strong> | Lotería de Boyacá (Sábado)</p>
    
    <div class="prizes-info" id="prizes-details">
      <!-- Los detalles se actualizan con JS -->
    </div>
  </div>

  <div class="progress-box">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700;">
      <span>Boletos Disponibles</span>
      <span id="avail-text">100 / 100</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot dot-green"></span> Disponible</div>
    <div class="legend-item"><span class="dot dot-gold"></span> Seleccionado</div>
    <div class="legend-item"><span class="dot dot-red"></span> Reservado</div>
  </div>

  <div style="display:flex; gap:10px">
    <button class="btn btn-out" style="flex:1" id="btn-random" onclick="selectRandom()">🎲 Número al Azar</button>
    <button class="btn btn-gold" onclick="clearSel()">Limpiar</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="card" style="text-align:left;">
    <label style="font-size:0.9rem; font-weight:700;">Boletos Seleccionados:</label>
    <input id="selected" readonly placeholder="Ninguno seleccionado">
    
    <label style="font-size:0.9rem; font-weight:700;">Total a Pagar:</label>
    <input id="total" readonly value="$0 COP">
    
    <label style="font-size:0.9rem; font-weight:700;">Tu Nombre Completo:</label>
    <input id="name" placeholder="Escribe tu nombre aquí">
    
    <div class="payment-box">
      <div>
        <p style="font-size:.85rem; margin:0">💳 <strong>Pago Nequi / Daviplata:</strong></p>
        <span style="font-weight:700; color:var(--primary-blue);" id="phone-num">311 521 5251</span>
      </div>
      <button class="btn-copy" id="btn-copy-el" onclick="copyPhone()">📋 Copiar</button>
    </div>

    <button class="btn-wsp" onclick="sendWsp()">📲 Reservar por WhatsApp</button>
  </div>

  <script>
    // --- SINTETIZADOR DE EFECTOS DE SONIDO (WEB AUDIO API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Activar contexto de audio al interactuar
    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    // 1. Sonido de Dado / Clic de Ruleta
    function playDiceSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180 + Math.random() * 120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // 2. Sonido Mágico / Cambio de Talonario
    function playShineSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // 3. Sonido Clic / Selección de Número
    function playPopSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.06);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    }

    // 4. Sonido Éxito / Confirmación
    function playSuccessSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.setValueAtTime(880, now + 0.12); // A5
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    }


    // --- LÓGICA DEL SORTEO ---
    const raffles = {
      oro: {
        title: "🥇 Sorteo Oro: $1'000.000 COP",
        ticketPrice: 20000,
        themeColor: "#f59e0b",
        borderColor: "#d97706",
        bgPrizes: "#fffbe3",
        borderPrizes: "#fde68a",
        prizes: `
          <div>🥇 <strong>Primer Premio:</strong> $1'000.000 COP (2 últimas cifras del Premio Mayor)</div>
          <div>🥈 <strong>Segundo Premio:</strong> $100.000 COP (Número anterior al ganador)</div>
          <div>🥉 <strong>Tercer Premio:</strong> $100.000 COP (Número posterior al ganador)</div>
          <div>🎖️ <strong>Cuarto Premio:</strong> $50.000 COP (Número invertido / espejo)</div>
        `,
        sold: [],
        sel: []
      },
      plata: {
        title: "🥈 Sorteo Plata: $500.000 COP",
        ticketPrice: 10000,
        themeColor: "#94a3b8",
        borderColor: "#475569",
        bgPrizes: "#f1f5f9",
        borderPrizes: "#cbd5e1",
        prizes: `
          <div>🥇 <strong>Primer Premio:</strong> $500.000 COP (2 últimas cifras del Premio Mayor)</div>
          <div>🥈 <strong>Segundo Premio:</strong> $50.000 COP (Número anterior al ganador)</div>
          <div>🥉 <strong>Tercer Premio:</strong> $50.000 COP (Número posterior al ganador)</div>
          <div>🎖️ <strong>Cuarto Premio:</strong> $25.000 COP (Número invertido / espejo)</div>
        `,
        sold: [],
        sel: []
      },
      bronce: {
        title: "🥉 Sorteo Bronce: $250.000 COP",
        ticketPrice: 5000,
        themeColor: "#d97706",
        borderColor: "#78350f",
        bgPrizes: "#fff7ed",
        borderPrizes: "#ffedd5",
        prizes: `
          <div>🥇 <strong>Primer Premio:</strong> $250.000 COP (2 últimas cifras del Premio Mayor)</div>
          <div>🥈 <strong>Segundo Premio:</strong> $25.000 COP (Número anterior al ganador)</div>
          <div>🥉 <strong>Tercer Premio:</strong> $25.000 COP (Número posterior al ganador)</div>
          <div>🎖️ <strong>Cuarto Premio:</strong> $12.500 COP (Número invertido / espejo)</div>
        `,
        sold: [],
        sel: []
      }
    };

    let currentRaffle = 'oro';

    function switchRaffle(type) {
      currentRaffle = type;
      
      playShineSound();

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });

      const card = document.getElementById('main-card');
      const gridEl = document.getElementById('grid');
      card.classList.remove('tab-switch-anim');
      gridEl.classList.remove('tab-switch-anim');
      void card.offsetWidth;
      card.classList.add('tab-switch-anim');
      gridEl.classList.add('tab-switch-anim');

      const data = raffles[type];
      document.getElementById('prize-title').innerText = data.title;
      document.getElementById('ticket-info').innerHTML = `Valor Ticket: <strong>$${data.ticketPrice.toLocaleString('es-CO')} COP</strong> | Lotería de Boyacá (Sábado)`;
      document.getElementById('prizes-details').innerHTML = data.prizes;

      document.documentElement.style.setProperty('--current-theme', data.themeColor);
      document.documentElement.style.setProperty('--current-border', data.borderColor);
      document.documentElement.style.setProperty('--current-bg-prizes', data.bgPrizes);
      document.documentElement.style.setProperty('--current-border-prizes', data.borderPrizes);

      renderGrid();
      update();
    }

    const grid = document.getElementById('grid');

    function renderGrid() {
      grid.innerHTML = '';
      const data = raffles[currentRaffle];

      for (let i = 0; i < 100; i++) {
        const n = i.toString().padStart(2, '0');
        const b = document.createElement('div');

        if (data.sold.includes(n)) {
          b.className = 'num sold';
          b.innerText = n;
          b.onclick = () => {
            b.classList.remove('shake');
            void b.offsetWidth;
            b.classList.add('shake');
          };
        } else {
          b.className = 'num' + (data.sel.includes(n) ? ' sel' : '');
          b.innerText = n;
          b.onclick = () => {
            playPopSound();
            toggleSelect(n);
          };
        }
        grid.appendChild(b);
      }
      updateStats();
    }

    function toggleSelect(n) {
      const data = raffles[currentRaffle];
      if (data.sel.includes(n)) {
        data.sel = data.sel.filter(x => x !== n);
      } else {
        data.sel.push(n);
      }
      renderGrid();
      update();
    }

    const update = () => {
      const data = raffles[currentRaffle];
      document.getElementById('selected').value = data.sel.length ? data.sel.join(', ') : 'Ninguno';
      document.getElementById('total').value = `$${(data.sel.length * data.ticketPrice).toLocaleString('es-CO')} COP`;
    };

    const updateStats = () => {
      const data = raffles[currentRaffle];
      const available = 100 - data.sold.length;
      document.getElementById('avail-text').innerText = `${available} / 100`;
      document.getElementById('progress-bar').style.width = `${available}%`;
    };

    /* --- RULETA CON DESACELERACIÓN PROGRESIVA --- */
    let isRolling = false;

    const selectRandom = () => {
      if (isRolling) return;
      
      const available = Array.from(grid.children).filter(el => !el.classList.contains('sold') && !el.classList.contains('sel'));
      if (!available.length) {
        return alert('No hay más números disponibles en este sorteo.');
      }

      isRolling = true;
      const btnRandom = document.getElementById('btn-random');
      btnRandom.disabled = true;

      const delays = [70, 70, 80, 90, 110, 140, 180, 230, 290, 360, 450];
      let step = 0;

      function stepSpin() {
        available.forEach(el => el.classList.remove('roulette-highlight'));
        const tempRandom = available[Math.floor(Math.random() * available.length)];
        tempRandom.classList.add('roulette-highlight');
        
        playDiceSound();

        step++;
        if (step < delays.length) {
          setTimeout(stepSpin, delays[step]);
        } else {
          setTimeout(() => {
            available.forEach(el => el.classList.remove('roulette-highlight'));
            const finalEl = available[Math.floor(Math.random() * available.length)];
            playSuccessSound();
            toggleSelect(finalEl.innerText);
            isRolling = false;
            btnRandom.disabled = false;
          }, delays[delays.length - 1]);
        }
      }

      stepSpin();
    };

    const clearSel = () => { 
      raffles[currentRaffle].sel = []; 
      renderGrid(); 
      update(); 
    };

    function copyPhone() {
      playSuccessSound();
      navigator.clipboard.writeText('3115215251');
      const copyBtn = document.getElementById('btn-copy-el');
      copyBtn.innerText = '✓ ¡Copiado!';
      copyBtn.classList.add('copied');
      
      setTimeout(() => {
        copyBtn.innerText = '📋 Copiar';
        copyBtn.classList.remove('copied');
      }, 2000);
    }

    function sendWsp() {
      const name = document.getElementById('name').value.trim();
      const data = raffles[currentRaffle];

      if (!name || !data.sel.length) {
        return alert('Por favor selecciona al menos un número e ingresa tu nombre.');
      }

      playSuccessSound();
      const categoryName = currentRaffle.toUpperCase();
      const msg = `Hola Castillo del Año! 👋🏼%0AQuiero reservar para el *SORTEO ${categoryName}*%0ANombre: *${name}*%0ABoletos reservados: *${data.sel.join(', ')}*%0ATotal a pagar: *$${(data.sel.length * data.ticketPrice).toLocaleString('es-CO')} COP*`;
      
      window.open(`https://wa.me/573505933518?text=${msg}`, '_blank');
    }

    // Inicializar sorteo
    switchRaffle('oro');
  </script>
</body>
</html>
